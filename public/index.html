<!DOCTYPE html>
<html lang="en-NG">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>devpay — Quick loans with flexible repayment</title>
    <meta
      name="description"
      content="Access quick loans with competitive rates and flexible repayment options. Apply in five short steps and see exactly what you'd repay before you commit."
    />

    <!--
      Matches the paper ground the pages open on, so mobile browser chrome does
      not sit against it as a black band.
    -->
    <meta name="theme-color" content="#F6F2E8" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-title" content="devpay" />

    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!--
      NOTE: the canonical/og:url host is taken from the comment in
      .env.production, which says these are "the production values devpay.ng
      ships with". Confirm the real public domain before this goes live —
      a wrong og:url makes shared links preview the wrong site.
    -->
    <link rel="canonical" href="https://devpay.ng/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="devpay" />
    <meta property="og:url" content="https://devpay.ng/" />
    <meta property="og:title" content="devpay — Quick loans with flexible repayment" />
    <meta
      property="og:description"
      content="Access quick loans with competitive rates and flexible repayment options. Apply in five short steps and see exactly what you'd repay before you commit."
    />
    <meta property="og:image" content="https://devpay.ng/logo512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="devpay" />
    <meta property="og:locale" content="en_NG" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="devpay — Quick loans with flexible repayment" />
    <meta
      name="twitter:description"
      content="Access quick loans with competitive rates and flexible repayment options. Apply in five short steps and see exactly what you'd repay before you commit."
    />
    <meta name="twitter:image" content="https://devpay.ng/logo512.png" />

    <!-- Google Places API -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDR5X9fQSrlUCC-9OFBOo-Ph_FQx0Zq8dw&libraries=places" async defer></script>
  </head>
  <body>
    <noscript>
      devpay needs JavaScript to run. Please enable it in your browser and
      reload this page.
    </noscript>
    <div id="root"></div>
  </body>
</html>
